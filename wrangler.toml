name = "ratatoskr"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put API_KEY` — never commit these)
# API_KEY

[[kv_namespaces]]
binding = "LINKS"
# Run `wrangler kv namespace create LINKS` and paste the resulting id below.
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# Optional: uncomment for local dev (run `wrangler kv namespace create LINKS --preview`)
# preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[[routes]]
pattern = "v4ri.xyz/*"
zone_name = "v4ri.xyz"
